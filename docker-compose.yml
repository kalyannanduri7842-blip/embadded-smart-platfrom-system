version: '3.8'

services:
  smartnest-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartnest-iot-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/backend/data/smartnest_db.json
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1));"]
      interval: 15s
      timeout: 5s
      retries: 3
